spring:
  application:
    name: distribucion
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=DistribucionDB;encrypt=false;trustServerCertificate=true
    username: sa
    password: sa_password_change_me
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
